  <rect class="input" x="866" y="324" width="172" height="70"/>
  <text x="882" y="354" class="tiny">AI：已生成第 3 版</text>
  <text x="882" y="378" class="tiny">并保留上一版可回退。</text>
  <rect class="input" x="866" y="416" width="172" height="86"/>
  <text x="882" y="448" class="tiny">继续修改...</text>
  <rect class="btn" x="902" y="522" width="100" height="38"/>
