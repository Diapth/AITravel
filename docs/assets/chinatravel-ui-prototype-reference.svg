  <rect class="soft" x="866" y="734" width="172" height="66"/>
  <text x="884" y="760" class="smallHead">V2 AI修改</text>
  <rect class="chip" x="884" y="772" width="110" height="22"/>
  <text class="chipText" x="896" y="788">回退到此版本</text>
  <rect class="soft" x="866" y="814" width="172" height="66"/>
  <text x="884" y="840" class="smallHead">V1 推荐打开</text>
  <rect class="chip" x="884" y="852" width="110" height="22"/>
  <text class="chipText" x="896" y="868">回退到此版本</text>

  <rect class="soft" x="1082" y="194" width="456" height="730"/>
  <text x="1108" y="228" class="section">桂林阳朔 4 天 3 晚</text>
  <rect class="chip" x="1348" y="202" width="64" height="32"/>
  <text class="chipText" x="1364" y="223">只读</text>
  <rect class="chip" x="1418" y="202" width="64" height="32"/>
  <text class="chipText" x="1435" y="223">编辑</text>
  <rect class="btn" x="1488" y="202" width="34" height="32"/>
  <text class="btnText" x="1497" y="223">改</text>
  <rect class="input" x="1108" y="254" width="190" height="160"/>
  <path class="mapLine" d="M1132 372 C1168 310, 1200 354, 1238 286 S1280 334, 1274 388"/>
  <circle class="jade" cx="1132" cy="372" r="8"/>
  <circle class="amber" cx="1200" cy="354" r="8"/>
  <circle class="red" cx="1238" cy="286" r="8"/>
  <text x="1128" y="286" class="smallHead">路线地图</text>
  <rect class="input" x="1316" y="254" width="196" height="160"/>
  <text x="1336" y="286" class="smallHead">预算与概览</text>
  <rect class="chip" x="1336" y="310" width="72" height="28"/>
  <text class="chipText" x="1350" y="329">交通 ¥820</text>
  <rect class="chip" x="1336" y="348" width="72" height="28"/>
  <text class="chipText" x="1350" y="367">住宿 ¥900</text>
  <rect class="warn" x="1336" y="386" width="92" height="22"/>
  <text class="warnText" x="1346" y="402">冲突检测</text>
  <rect class="chip" x="1108" y="436" width="52" height="30"/>
  <text class="chipText" x="1124" y="456">D1</text>
  <rect class="chip" x="1170" y="436" width="52" height="30"/>
  <text class="chipText" x="1186" y="456">D2</text>
  <rect class="chip" x="1232" y="436" width="52" height="30"/>
  <text class="chipText" x="1248" y="456">D3</text>
  <rect class="chip" x="1294" y="436" width="52" height="30"/>
  <text class="chipText" x="1310" y="456">D4</text>

  <rect class="input" x="1108" y="488" width="404" height="362"/>
  <text x="1130" y="520" class="section">每日行程编辑器</text>
  <rect class="soft" x="1130" y="542" width="360" height="48"/>
  <text x="1150" y="572" class="label">D2 阳朔轻松路线 · 住宿 西街附近</text>
  <rect class="chip" x="1130" y="608" width="68" height="28"/>
  <text class="chipText" x="1144" y="627">交通</text>
  <rect class="input" x="1210" y="602" width="280" height="40"/>
  <text x="1228" y="627" class="tiny">桂林站 → 阳朔 · 09:00-10:40 · ¥120</text>
  <rect class="chip" x="1130" y="654" width="68" height="28"/>
  <text class="chipText" x="1144" y="673">景点</text>
  <rect class="input" x="1210" y="648" width="280" height="40"/>
  <text x="1228" y="673" class="tiny">遇龙河骑行 · 14:00-16:00 · ¥80</text>
  <rect class="chip" x="1130" y="700" width="68" height="28"/>
  <text class="chipText" x="1144" y="719">餐饮</text>
  <rect class="input" x="1210" y="694" width="280" height="40"/>
  <text x="1228" y="719" class="tiny">啤酒鱼 · 推荐菜 · 人均 ¥90</text>
  <rect class="chip" x="1130" y="746" width="68" height="28"/>
  <text class="chipText" x="1144" y="765">住宿</text>
  <rect class="input" x="1210" y="740" width="280" height="40"/>
  <text x="1228" y="765" class="tiny">西街精品客栈 · 1间 · ¥320</text>
  <rect class="warn" x="1130" y="802" width="156" height="28"/>
  <text class="warnText" x="1144" y="822">校验警告：时间重叠</text>
  <rect class="btn" x="1322" y="794" width="168" height="44"/>
  <text class="btnText" x="1360" y="822">保存为新版本</text>

  <!-- Conflict modal -->
  <rect x="506" y="776" width="360" height="138" rx="16" fill="#ffffff" stroke="#e7b25a" stroke-width="2" filter="url(#shadow)"/>
  <text x="532" y="812" class="section">版本冲突</text>
  <text x="532" y="842" class="muted">当前会话已有更新版本，是否继续另存？</text>
  <rect class="chip" x="532" y="864" width="126" height="34"/>
  <text class="chipText" x="548" y="886">刷新到最新版本</text>
  <rect class="btn" x="674" y="864" width="118" height="34"/>
  <text class="btnText" x="694" y="886">仍另存新版本</text>
</svg>
